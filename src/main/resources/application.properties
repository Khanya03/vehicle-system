spring.application.name=vehicle-system

# H2 Configuration (for development/testing)
spring.datasource.url=jdbc:h2:mem:vehicledb
spring.datasource.username=root
spring.datasource.password=Lisakhanya@2003

# H2 Console (optional - allows viewing DB at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
server.port=8080

